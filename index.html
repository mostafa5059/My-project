<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأفعال والمفردات الألمانية A1 - A2.2</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary: #4f46e5; --primary-light: #818cf8; --primary-dark: #3730a3; --accent: #10b981; --bg-color: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0; --radius-lg: 16px; --radius-xl: 24px; --transition: all 0.3s ease; }
  *{box-sizing:border-box;margin:0;padding:0; font-family: 'Cairo', Tahoma, sans-serif;}
  body{background:var(--bg-color);color:var(--text-main);line-height:1.7; overflow-x: hidden;}
  header{background:linear-gradient(135deg, #1e1b4b, #4f46e5);color:#fff;padding:40px 20px;text-align:center; border-bottom-left-radius: var(--radius-xl); border-bottom-right-radius: var(--radius-xl); position: relative;}
  header h1{font-size:28px;font-weight:700;margin-bottom:10px;}
  header p { font-size: 16px; opacity: 0.9;}
  .lang-buttons { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .lang-btn { background: rgba(255,255,255,0.2); color: #fff; border: 2px solid rgba(255,255,255,0.4); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 14px; font-family: 'Cairo', sans-serif; }
  .container{max-width:1150px;margin:0 auto;padding:30px 20px;}
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px; justify-content: center;}
  .tab{padding:12px 24px;border:none;background:var(--card-bg);color:var(--text-muted);border-radius:30px;cursor:pointer;font-size:15px;font-weight:600; border: 1px solid var(--border-color);}
  .tab.active{background:var(--primary);color:#fff;}
  .controls{margin-bottom:25px; max-width: 600px; margin-left: auto; margin-right: auto;}
  .controls input{width:100%;padding:16px 24px;border:2px solid var(--border-color);border-radius:20px;font-size:16px;outline:none;}
  .filter-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px; justify-content: center;}
  .filter-btn{padding:8px 18px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-muted);border-radius:20px;cursor:pointer;font-size:14px; font-weight: 600;}
  .filter-btn.active{background:var(--primary-dark);color:#fff;}
  .list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
  .card{ background:var(--card-bg); padding:22px; border-radius:var(--radius-lg); cursor:pointer; border-right:6px solid var(--primary); position:relative; border: 1px solid var(--border-color); }
  .card.noun { border-right-color: var(--accent); } .card.adj { border-right-color: #f59e0b; }
  .card .de { font-weight: 800; font-size: 22px; color: var(--primary-dark); margin-bottom: 6px; direction: ltr; text-align: right; padding-left: 40px; }
  .card .ar { font-size: 15px; color: var(--text-muted); font-weight: 600; }
  .card.noun .de { color: #047857; } .card.adj .de { color: #b45309; }
  .audio-btn{position:absolute; top:16px; left:16px; background:#f1f5f9; border:none; border-radius:50%; width:38px; height:38px; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; color: var(--primary);}
  .hidden{display:none!important}
  .modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.6);z-index:100;padding:20px;overflow-y:auto;}
  .modal.active{display:flex;align-items:center;justify-content:center;}
  .modal-content{background:var(--card-bg);border-radius:var(--radius-xl);max-width:680px;width:100%;padding:35px;position:relative; max-height: 90vh; overflow-y: auto;}
  .close-btn{position:absolute;top:20px;left:20px;background:#fee2e2;color:#dc2626;border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700;}
  .modal-content h2{color:var(--primary-dark);margin-bottom:10px;display:inline-block; font-size:32px; font-weight: 800;}
  .badge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;margin:6px 6px 15px 0;}
  .badge.trennbar{background:#dbeafe;color:#1e40af} .badge.reflexiv{background:#fce7f3;color:#9d174d} .badge.unregelmäßig{background:#fef3c7;color:#92400e} .badge.regular{background:#dcfce7;color:#166534}
  .rule-hint{background:#fffbeb;border-right:4px solid #f59e0b;padding:14px 18px;border-radius:10px;font-size:14px;color:#92400e;margin-bottom:20px;}
  .section-title{font-size:16px;font-weight:700;color:var(--primary);margin:25px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--border-color);}
  .conj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .conj-item { background: #ffffff; padding: 14px 18px; border-radius: 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); font-weight: 600; }
  .conj-item .pron { color: var(--primary-dark); font-weight: 700; min-width: 80px; direction: rtl; }
  .conj-item span:not(.pron) { direction: ltr; text-align: left; font-weight: 700; }
  .meta{background:#eff6ff;padding:16px;border-radius:12px;margin-top:10px;font-size:15px; border: 1px solid #bfdbfe; font-weight: 600;}
  .info-block { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .info-item { background: #f0fdf4; padding: 14px 18px; border-radius: 12px; font-size: 15px; border-right: 5px solid var(--accent); font-weight: 600; }
  .info-item strong { color: #065f46; display: block; font-size: 13px; margin-bottom: 6px;}
  .rules-container{background:var(--card-bg);padding:40px;border-radius:var(--radius-xl);border: 1px solid var(--border-color);}
  .rule-section { border-bottom: 1px solid var(--border-color); padding-bottom: 30px; margin-bottom: 30px; }
  .rule-section:last-child { border-bottom: none; }
  .rule-section h3{color:var(--primary-dark);margin-bottom:15px;font-size:22px;border-right:6px solid var(--primary);padding:20px; cursor: pointer; display:flex; justify-content:space-between; align-items: center; background: #f8fafc; border-radius: 14px; font-weight: 800;}
  .rule-section h3::after { content: '▼'; font-size: 16px; color: var(--primary); }
  .rule-section.open h3::after { transform: rotate(180deg); }
  .rule-content { display: none; padding: 30px; background: #fff; border: 1px solid var(--border-color); border-radius: 14px; margin-top: 20px;}
  .rule-section.open .rule-content { display: block;}
  .rule-content p{font-size:17px;color:var(--text-main);margin-bottom:18px; line-height: 2;}
  .rule-content ul{padding-right:25px;margin-bottom:25px}
  .rule-content li{font-size:16px;color:var(--text-main);margin-bottom:14px; line-height: 1.9;}
  .rule-content code{background:#eff6ff;color:var(--primary-dark);padding:5px 12px;border-radius:8px;font-family:'Courier New',monospace;font-weight:bold; font-size: 15px;}
  .example-box { background: #f0fdf4; border-right: 5px solid var(--accent); padding: 25px 30px; margin: 25px 0; border-radius: 12px; font-size: 16px; line-height: 2.1; }
  .example-box strong { color: #047857; font-weight: 800;}
  table { width: 100%; border-collapse: collapse; margin: 25px 0; font-size: 15px; border: 1px solid var(--border-color);}
  th, td { border: 1px solid var(--border-color); padding: 14px; text-align: center; }
  th { background: #eff6ff; color: var(--primary-dark); font-weight: 700;}
  .flashcard-container { max-width: 550px; margin: 40px auto; }
  .flashcard { background: var(--card-bg); border-radius: var(--radius-xl); padding: 60px 30px; cursor: pointer; min-height: 280px; display: flex; align-items: center; justify-content: center; flex-direction: column; border: 2px solid var(--border-color); }
  .flashcard-front { color: var(--primary-dark); font-size: 36px; font-weight: 700; }
  .flashcard-back { color: var(--accent); font-size: 36px; font-weight: 700; display: none; }
  .flashcard-hint { color: #94a3b8; font-size: 16px; margin-top: 25px; font-weight: 600;}
  .btn-next { display: block; margin: 35px auto; padding: 16px 45px; background: var(--primary); color: #fff; border: none; border-radius: 30px; cursor: pointer; font-size: 18px; font-weight: 700; }
  @media (max-width: 768px) {
    header { padding: 25px 15px; padding-top: 80px; }
    .lang-buttons { top: 15px; left: 15px; right: 15px; justify-content: center; }
    .tabs { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 10px 16px; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
    .list-grid { grid-template-columns: 1fr; gap: 12px; }
    .conj-grid { grid-template-columns: 1fr; }
    .modal-content { padding: 20px 15px; border-radius: 16px; }
    .modal-content h2 { font-size: 24px; }
    .info-block { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>
const pronouns = ["ich","du","er/sie/es","wir","ihr","sie/Sie"];
const typeLabels = { regular:{text:"منتظم",cls:"regular"}, unregelmäßig:{text:"⚡ غير منتظم",cls:"unregelmäßig"}, trennbar:{text:"🔹 منفصل",cls:"trennbar"}, reflexiv:{text:"🔄 انعكاسي",cls:"reflexiv"} };
const ruleHints = { unregelmäßig:"⚡ فعل غير منتظم: تتغير حركة الجذر في المضارع (du/er) وفي الماضي.", trennbar:"🔹 فعل منفصل: البادئة تُنقل لنهاية الجملة (مثل: stehe auf).", reflexiv:"🔄 فعل انعكاسي: يحتاج ضميراً انعكاسياً (mich/dich/sich...)." };
const isDativ = (de) => ["helfen", "danken", "gefallen", "gehören", "passen", "antworten", "zuhören", "empfehlen"].includes(de.replace(" (Dativ)", ""));
const isSein = (de) => ["aufstehen", "ausgehen", "einsteigen", "aussteigen", "umsteigen", "ankommen", "mitkommen", "zurückkommen", "laufen", "reisen", "wandern", "gehen", "kommen", "fahren", "fliegen", "werden"].includes(de.replace(" (sein)", ""));
let currentTab = "verbs", currentFilter = "all", currentSearch = "";

function speak(text) { if ('speechSynthesis' in window) { const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'de-DE'; utterance.rate = 0.9; window.speechSynthesis.speak(utterance); } }

function renderVerbs() {
  const f = currentSearch.trim().toLowerCase();
  const sourceData = contentLanguage === 'en' ? VERBS_EN : VERBS;
  const filtered = sourceData.filter(v => {
    const word = contentLanguage === 'en' ? v.en : v.de;
    return word.toLowerCase().includes(f) || v.ar.includes(currentSearch.trim());
  });
  const list = document.getElementById("verbList");
  list.innerHTML = filtered.map(v => {
    const word = contentLanguage === 'en' ? v.en : v.de;
    const idx = sourceData.indexOf(v);
    return '<div class="card" data-index="' + idx + '"><button class="audio-btn" onclick="event.stopPropagation(); speak(\'' + word.replace(/ \(.*\)/, '') + '\')">🔊</button><div class="de">' + word + '</div><div class="ar">' + v.ar + '</div></div>';
  }).join("");
  list.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openVerb(+c.getAttribute("data-index"))));
  if (typeof applyTranslationVisibility === 'function') applyTranslationVisibility();
}
function renderNouns() {
  const f = currentSearch.trim().toLowerCase();
  const filtered = NOUNS.filter(n => n.de.toLowerCase().includes(f) || n.ar.includes(currentSearch.trim()));
  const list = document.getElementById("nounList");
  list.innerHTML = filtered.map(n => '<div class="card noun" data-index="' + NOUNS.indexOf(n) + '"><button class="audio-btn" onclick="event.stopPropagation(); speak(\'' + n.de.replace('der ','').replace('die ','').replace('das ','') + '\')">🔊</button><div class="de">' + n.de + '</div><div class="ar">' + n.ar + '</div></div>').join("");
  list.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openNoun(+c.getAttribute("data-index"))));
  if (typeof applyTranslationVisibility === 'function') applyTranslationVisibility();
}
function renderAdjectives() {
  const f = currentSearch.trim().toLowerCase();
  const filtered = ADJECTIVES.filter(a => a.de.toLowerCase().includes(f) || a.ar.includes(currentSearch.trim()));
  const list = document.getElementById("adjList");
  list.innerHTML = filtered.map(a => '<div class="card adj" data-index="' + ADJECTIVES.indexOf(a) + '"><button class="audio-btn" onclick="event.stopPropagation(); speak(\'' + a.de + '\')">🔊</button><div class="de">' + a.de + '</div><div class="ar">' + a.ar + '</div></div>').join("");
  list.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openAdjective(+c.getAttribute("data-index"))));
  if (typeof applyTranslationVisibility === 'function') applyTranslationVisibility();
}
function openVerb(index) {
  const sourceData = contentLanguage === 'en' ? VERBS_EN : VERBS;
  const v = sourceData[index];
  if (!v) return;
  const word = contentLanguage === 'en' ? v.en : v.de;
  const isEnglish = contentLanguage === 'en';
  
  let content = '<button class="close-btn" onclick="closeModal()">✕</button>';
  content += '<div style="text-align:center; margin-bottom:20px;">';
  content += '<h2 style="display:inline-block; padding-left:0; margin-bottom:8px;">' + word + '</h2>';
  content += ' <button class="audio-btn" style="position:static; display:inline-flex; vertical-align:middle; width:42px; height:42px; font-size:20px;" onclick="speak(\'' + word + '\')">🔊</button>';
  content += '<div style="color:var(--text-muted); font-size:18px; font-weight:600; margin-top:5px;">' + v.ar + '</div></div>';
  
  if (isEnglish) {
    content += '<div class="section-title">📘 Past Tense</div><div class="conj-item"><span>' + v.past + '</span></div>';
    content += '<div class="section-title">✅ Past Participle</div><div class="conj-item"><span>' + v.pp + '</span></div>';
  } else {
    const präsensHTML = v.präsens.map((form, i) => '<div class="conj-item"><span class="pron">' + pronouns[i] + '</span><span>' + form + '</span></div>').join("");
    content += '<div class="section-title">📘 المضارع</div><div class="conj-grid">' + präsensHTML + '</div>';
    content += '<div class="section-title">⏳ الماضي البسيط</div><div class="conj-item"><span>' + v.präteritum + '</span></div>';
    content += '<div class="section-title">✅ الماضي التام</div><div class="conj-item"><span>' + v.perfekt + '</span></div>';
  }
  
  if (v.example) content += '<div class="section-title">💬 مثال</div><div class="example-box">' + v.example + '</div>';
  
  document.getElementById("modalContent").innerHTML = content;
  document.getElementById("modal").classList.add("active");
}
function openNoun(index) {
  const n = NOUNS[index];
  document.getElementById("modalContent").innerHTML = '<button class="close-btn" onclick="closeModal()">✕</button><div style="text-align:center; margin-bottom:20px;"><h2 style="display:inline-block; padding-left:0; margin-bottom:8px;">' + n.de + '</h2> <button class="audio-btn" style="position:static; display:inline-flex; vertical-align:middle; width:42px; height:42px; font-size:20px;" onclick="speak(\'' + n.de + '\')">🔊</button>' + (typeof translationHidden !== 'undefined' && translationHidden ? '' : '<div style="color:var(--text-muted); font-size:18px; font-weight:600; margin-top:5px;">' + n.ar + '</div>') + '</div><div class="section-title">📦 الجمع</div><div class="conj-item" style="margin-bottom:10px;"><span class="pron">Plural</span><span>' + n.plural + '</span><button class="audio-btn" style="position:static; width:30px; height:30px; font-size:14px; margin-right:auto;" onclick="speak(\'' + n.plural + '\')">🔊</button></div><div class="section-title">📐 الحالات الإعرابية</div><div class="info-block"><div class="info-item"><strong>Nominativ</strong>' + n.de + '</div><div class="info-item"><strong>Akkusativ</strong>' + n.akk + '</div><div class="info-item"><strong>Dativ</strong>' + n.dat + '</div></div>';
  document.getElementById("modal").classList.add("active");
}
function openAdjective(index) {
  const a = ADJECTIVES[index];
  document.getElementById("modalContent").innerHTML = '<button class="close-btn" onclick="closeModal()">✕</button><div style="text-align:center; margin-bottom:20px;"><h2 style="display:inline-block; padding-left:0; margin-bottom:8px;">' + a.de + '</h2> <button class="audio-btn" style="position:static; display:inline-flex; vertical-align:middle; width:42px; height:42px; font-size:20px;" onclick="speak(\'' + a.de + '\')">🔊</button>' + (typeof translationHidden !== 'undefined' && translationHidden ? '' : '<div style="color:var(--text-muted); font-size:18px; font-weight:600; margin-top:5px;">' + a.ar + '</div>') + '</div><div class="rule-hint">الصفات تُصرَّف حسب الحالة والجنس والعدد عند استخدامها قبل الاسم، وتبقى بدون تصريف عند استخدامها كخبر.</div>';
  document.getElementById("modal").classList.add("active");
}
function closeModal() { document.getElementById("modal").classList.remove("active"); }
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add("hidden"));
  document.getElementById("tab-" + name).classList.remove("hidden");
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.getAttribute("data-tab") === name));
  document.getElementById("verbFilters").style.display = (name === "verbs") ? "flex" : "none";
  document.getElementById("search").style.display = (name === "verbs" || name === "nouns" || name === "adjectives") ? "block" : "none";
  if (name === "flashcards") newCard();
  else if (name === "verbs" || name === "nouns" || name === "adjectives") renderCurrent();
  else if (name === "rules") document.getElementById("rulesContent").innerHTML = RULES_HTML;
  else if (name === "speaking") { loadShadow(); loadChallenge(); }
  else if (name === "exercises") { startExercises(); }
  else if (name === "writing") { initWritingTab(); }
  else if (name === "listening") { initListeningTab(); }
  else if (name === "dialogues") { initDialoguesTab(); }
  else if (name === "basics") { initBasicsTab(); }  
  else if (name === "reading") { initReadingTab(); }
  else if (name === "progress") { initProgressTab(); }
  else if (name === "resources") { renderResources(); }
  else if (name === "review") { initReviewTab(); }
}
function renderCurrent() {
  if (currentTab === "verbs") renderVerbs(); else if (currentTab === "nouns") renderNouns(); else if (currentTab === "adjectives") renderAdjectives();
}
let currentCard = null, isFlipped = false;
function newCard() { const v = VERBS[Math.floor(Math.random() * VERBS.length)]; currentCard = v; isFlipped = false; document.getElementById("card-front").innerText = v.ar; document.getElementById("card-back").innerText = v.de; document.getElementById("card-front").style.display = "block"; document.getElementById("card-back").style.display = "none"; }
function flipCard() { if (!currentCard) return; isFlipped = !isFlipped; document.getElementById("card-front").style.display = isFlipped ? "none" : "block"; document.getElementById("card-back").style.display = isFlipped ? "block" : "none"; if (isFlipped) speak(currentCard.de.replace(/ \(.*\)/, '')); }
function nextCard() { newCard(); }
document.addEventListener('click', function(e) { if (e.target.tagName === 'H3' && e.target.parentElement.classList.contains('rule-section')) { e.target.parentElement.classList.toggle('open'); } });
let currentShadow = 0, currentChallenge = 0;
function switchSpeakingMode(mode) {
  document.querySelectorAll('#tab-speaking .filter-btn').forEach(b => b.classList.remove('active'));
  if (mode === 'shadowing') { document.querySelector('#tab-speaking .filter-btn:nth-child(1)').classList.add('active'); document.getElementById('shadowingSection').classList.remove('hidden'); document.getElementById('challengeSection').classList.add('hidden'); loadShadow(); }
  else { document.querySelector('#tab-speaking .filter-btn:nth-child(2)').classList.add('active'); document.getElementById('challengeSection').classList.remove('hidden'); document.getElementById('shadowingSection').classList.add('hidden'); loadChallenge(); }
}
function loadShadow() { const s = SHADOWING_DATA[currentShadow]; document.getElementById('shadowDe').innerText = s.de; document.getElementById('shadowAr').innerText = s.ar; document.getElementById('shadowCounter').innerText = 'الجملة ' + (currentShadow + 1) + ' من ' + SHADOWING_DATA.length; }
function nextShadow() { currentShadow = (currentShadow + 1) % SHADOWING_DATA.length; loadShadow(); }
function loadChallenge() { const c = SPEAKING_CHALLENGES[currentChallenge]; document.getElementById('challengeQ').innerText = c.q; document.getElementById('challengeQAr').innerText = c.qAr; document.getElementById('challengeA').innerText = c.a; document.getElementById('challengeAAr').innerText = c.aAr; document.getElementById('challengeAnsBox').style.display = 'none'; }
function showAnswer() { document.getElementById('challengeAnsBox').style.display = 'block'; }
function nextChallenge() { currentChallenge = (currentChallenge + 1) % SPEAKING_CHALLENGES.length; loadChallenge(); }
function renderResources() {
  const container = document.getElementById('resourcesGrid');
  if (typeof RESOURCES === 'undefined') { container.innerHTML = '<p style="text-align:center; color:#dc2626;">⚠️ ملف المصادر غير محمّل.</p>'; return; }
  container.innerHTML = RESOURCES.map(r => '<a href="' + r.url + '" target="_blank" rel="noopener" style="text-decoration:none;"><div style="background:#fff; padding:22px; border-radius:14px; border-right:5px solid #4f46e5; height:100%; display:flex; flex-direction:column;"><h3 style="color:#1e3a8a; font-size:18px; margin-bottom:10px; font-weight:700;">' + r.icon + ' ' + r.title + '</h3><p style="color:#64748b; font-size:14px; line-height:1.6; flex-grow:1;">' + r.description + '</p><span style="color:#4f46e5; font-weight:700; font-size:14px; margin-top:12px;">زيارة المصدر ↗️</span></div></a>').join('');
}
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.getAttribute("data-tab"))));
document.querySelectorAll(".filter-btn").forEach(b => b.addEventListener("click", () => { document.querySelectorAll(".filter-btn").forEach(x => x.classList.remove("active")); b.classList.add("active"); currentFilter = b.getAttribute("data-filter"); renderVerbs(); }));
document.getElementById("search").addEventListener("input", e => { currentSearch = e.target.value; renderCurrent(); });
  let contentLanguage = localStorage.getItem('content_language') || 'de';

function toggleContentLanguage() {
  contentLanguage = contentLanguage === 'de' ? 'en' : 'de';
  localStorage.setItem('content_language', contentLanguage);
  document.getElementById('contentLangBtn').textContent = contentLanguage === 'de' ? '🇬🇧 English' : '🇩🇪 Deutsch';
  
  const filters = document.getElementById('verbFilters');
  if (filters) {
    filters.style.display = contentLanguage === 'en' ? 'none' : 'flex';
  }
  
  if (currentTab === 'verbs') renderVerbs();
}
renderVerbs();
</script>
</body>
</html>
