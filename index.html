<body>
<header>
  <div class="lang-buttons">
    <button id="langSwitchBtn" class="lang-btn" onclick="switchLanguage()">Deutsch 🇩🇪</button>
    <button id="translationToggleBtn" class="lang-btn" onclick="toggleTranslation()">إخفاء الترجمة 👁️‍🗨️</button>
  </div>
  <h1>🇩🇪 الأفعال والمفردات الألمانية A1 - A2.2</h1>
  <p>منصة شاملة للمذاكرة والتحضير للامتحانات</p>
</header>
<div class="container">
  <div class="tabs">
    <button class="tab active" data-tab="verbs">🔤 الأفعال</button>
    <button class="tab" data-tab="nouns">📦 الأسماء</button>
    <button class="tab" data-tab="adjectives">🎨 الصفات</button>
    <button class="tab" data-tab="basics">📚 الأساسيات</button>
    <button class="tab" data-tab="flashcards">🧠 الاختبار</button>
    <button class="tab" data-tab="speaking">🗣️ التحدث</button>
    <button class="tab" data-tab="exercises">📝 التمارين</button>
    <button class="tab" data-tab="writing">✍️ تدريب الكتابة</button>
    <button class="tab" data-tab="listening">🎧 تدريب الاستماع</button>
    <button class="tab" data-tab="dialogues">💬 المحادثات</button>
    <button class="tab" data-tab="progress">📊 لوحة التقدم</button>
    <button class="tab" data-tab="review">🎯 المراجعة اليومية</button>
    <button class="tab" data-tab="rules">📖 القواعد</button>
    <button class="tab" data-tab="resources">📚 المصادر</button>
  </div>
  <div class="controls"><input type="text" id="search" placeholder="🔍 ابحث بالعربي أو الألماني..."></div>
  <div class="filter-btns" id="verbFilters">
    <button class="filter-btn active" data-filter="all">الكل</button>
    <button class="filter-btn" data-filter="regular">منتظمة</button>
    <button class="filter-btn" data-filter="unregelmäßig">غير منتظمة</button>
    <button class="filter-btn" data-filter="trennbar">منفصلة</button>
    <button class="filter-btn" data-filter="reflexiv">انعكاسية</button>
  </div>
  <div id="tab-verbs"><div class="list-grid" id="verbList"></div></div>
  <div id="tab-nouns" class="hidden"><div class="list-grid" id="nounList"></div></div>
  <div id="tab-adjectives" class="hidden"><div class="list-grid" id="adjList"></div></div>
  <div id="tab-basics" class="hidden"><div id="basicsContent"></div></div>
  <div id="tab-flashcards" class="hidden">
    <div class="flashcard-container">
      <div class="flashcard" onclick="flipCard()">
        <h2 id="card-front" class="flashcard-front">اضغط للبدء</h2>
        <h2 id="card-back" class="flashcard-back">الإجابة</h2>
        <p class="flashcard-hint">(اضغط لقلب البطاقة)</p>
      </div>
      <button class="btn-next" onclick="nextCard()">التالي ➡️</button>
    </div>
  </div>
  <div id="tab-speaking" class="hidden">
    <div style="display:flex; gap:15px; flex-wrap:wrap; justify-content:center; margin-bottom:30px;">
      <button class="filter-btn active" onclick="switchSpeakingMode('shadowing')">🔊 التكرار</button>
      <button class="filter-btn" onclick="switchSpeakingMode('challenge')">💬 تحدي التحدث</button>
    </div>
    <div id="shadowingSection">
      <div style="background:var(--card-bg); padding:50px 30px; border-radius:var(--radius-xl); text-align:center; max-width:650px; margin:0 auto; border-top: 6px solid var(--primary);">
        <p id="shadowCounter" style="color:var(--primary); font-weight:700; margin-bottom:20px;">الجملة 1 من 30</p>
        <h2 id="shadowDe" style="color:var(--primary-dark); font-size:32px; margin-bottom:20px; font-weight:700;">-</h2>
        <p id="shadowAr" style="color:var(--accent); font-size:20px; margin-bottom:35px; font-weight:700; background:#f0fdf4; padding:12px 25px; border-radius:12px; display:inline-block;">-</p>
        <div style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap;">
          <button class="btn-next" onclick="speak(document.getElementById('shadowDe').innerText)" style="margin:0; background:var(--primary);">🔊 استمع</button>
          <button class="btn-next" onclick="nextShadow()" style="margin:0; background:var(--accent);">التالي ➡️</button>
        </div>
      </div>
    </div>
    <div id="challengeSection" class="hidden">
      <div style="background:var(--card-bg); padding:50px 30px; border-radius:var(--radius-xl); text-align:center; max-width:650px; margin:0 auto; border-top: 6px solid #f59e0b;">
        <h2 id="challengeQ" style="color:var(--primary-dark); font-size:28px; margin-bottom:12px; font-weight:700;">-</h2>
        <p id="challengeQAr" style="color:var(--text-muted); font-size:18px; margin-bottom:25px; font-weight:600;">-</p>
        <button class="btn-next" onclick="speak(document.getElementById('challengeQ').innerText)" style="margin:15px auto; background:var(--primary);">🔊 استمع للسؤال</button>
        <div id="challengeAnsBox" style="display:none; background:#f0fdf4; padding:25px; border-radius:12px; margin-top:25px;">
          <h3 id="challengeA" style="color:var(--accent); font-size:24px; margin-bottom:10px; font-weight:700;">-</h3>
          <p id="challengeAAr" style="color:var(--text-muted); font-size:18px; font-weight:600;">-</p>
        </div>
        <div style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap; margin-top:25px;">
          <button class="btn-next" onclick="showAnswer()" style="margin:0; background:#d97706;">إظهار الإجابة 👁️</button>
          <button class="btn-next" onclick="nextChallenge()" style="margin:0; background:var(--primary);">سؤال جديد ➡️</button>
        </div>
      </div>
    </div>
  </div>
  <div id="tab-exercises" class="hidden">
    <div style="max-width:700px; margin:0 auto;">
      <div style="background:#fff; padding:40px 30px; border-radius:16px; text-align:center;">
        <p id="exerciseProgress" style="color:#64748b; font-weight:600; margin-bottom:20px;">السؤال 1 من 20</p>
        <h2 id="exerciseQuestion" style="color:#1e3a8a; font-size:24px; margin-bottom:12px;">-</h2>
        <p id="exerciseQuestionAr" style="color:#64748b; font-size:16px; margin-bottom:25px;">-</p>
        <div id="exerciseOptions" style="display:flex; flex-direction:column; gap:12px; max-width:400px; margin:0 auto;"></div>
        <div id="exerciseFeedback" style="margin-top:25px; display:none; padding:15px; border-radius:10px;"></div>
        <button id="exerciseNextBtn" onclick="nextExercise()" style="display:none; margin-top:20px; padding:14px 35px; background:#4f46e5; color:#fff; border:none; border-radius:25px; cursor:pointer; font-size:16px; font-weight:700;">السؤال التالي ➡️</button>
      </div>
    </div>
  </div>
  <div id="tab-writing" class="hidden"><div id="writingContent"></div></div>
  <div id="tab-listening" class="hidden"><div id="listeningContent"></div></div>
  <div id="tab-dialogues" class="hidden"><div id="dialoguesContent"></div></div>
  <div id="tab-progress" class="hidden"><div id="progressContent"></div></div>
  <div id="tab-review" class="hidden"><div id="reviewContent"></div></div>
  <div id="tab-rules" class="hidden"><div class="rules-container" id="rulesContent"></div></div>
  <div id="tab-resources" class="hidden">
    <div style="max-width:850px; margin:0 auto;">
      <h2 style="color:#1e3a8a; text-align:center; margin-bottom:25px; font-size:24px;">📚 مصادر رسمية موثوقة لتعلم الألمانية</h2>
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:18px;" id="resourcesGrid"></div>
    </div>
  </div>
</div>
<div class="modal" id="modal"><div class="modal-content" id="modalContent"></div></div>

<script src="verbs.js"></script>
<script src="rules.js"></script>
<script src="speaking.js"></script>
<script src="exercises.js"></script>
<script src="review.js"></script>
<script src="writing.js"></script>
<script src="listening.js"></script>
<script src="dialogues.js"></script>
<script src="progress.js"></script>
<script src="i18n.js"></script>
<script src="resources.js"></script>
<script src="basics.js"></script>

<script>
const pronouns = ["ich","du","er/sie/es","wir","ihr","sie/Sie"];
const typeLabels = { regular:{text:"منتظم",cls:"regular"}, unregelmäßig:{text:"⚡ غير منتظم",cls:"unregelmäßig"}, trennbar:{text:"🔹 منفصل",cls:"trennbar"}, reflexiv:{text:"🔄 انعكاسي",cls:"reflexiv"} };
const ruleHints = { unregelmäßig:"⚡ فعل غير منتظم: تتغير حركة الجذر في المضارع (du/er) وفي الماضي.", trennbar:"🔹 فعل منفصل: البادئة تُنقل لنهاية الجملة (مثل: stehe auf).", reflexiv:"🔄 فعل انعكاسي: يحتاج ضميراً انعكاسياً (mich/dich/sich...)." };
const isDativ = (de) => ["helfen", "danken", "gefallen", "gehören", "passen", "antworten", "zuhören", "empfehlen"].includes(de.replace(" (Dativ)", ""));
const isSein = (de) => ["aufstehen", "ausgehen", "einsteigen", "aussteigen", "umsteigen", "ankommen", "mitkommen", "zurückkommen", "laufen", "reisen", "wandern", "gehen", "kommen", "fahren", "fliegen", "werden"].includes(de.replace(" (sein)", ""));
let currentTab = "verbs", currentFilter = "all", currentSearch = "";

function speak(text) { if ('speechSynthesis' in window) { const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'de-DE'; utterance.rate = 0.9; window.speechSynthesis.speak(utterance); } }

function renderVerbs() {
  const f = currentSearch.trim().toLowerCase();
  const filtered = VERBS.filter(v => (v.de.toLowerCase().includes(f) || v.ar.includes(currentSearch.trim())) && (currentFilter === "all" || v.type === currentFilter));
  const list = document.getElementById("verbList");
  list.innerHTML = filtered.map(v => '<div class="card" data-index="' + VERBS.indexOf(v) + '"><button class="audio-btn" onclick="event.stopPropagation(); speak(\'' + v.de.replace(/ \(.*\)/, '') + '\')">🔊</button><div class="de">' + v.de + '</div><div class="ar">' + v.ar + '</div></div>').join("");
  list.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openVerb(+c.getAttribute("data-index"))));
  applyTranslationVisibility();
}
function renderNouns() {
  const f = currentSearch.trim().toLowerCase();
  const filtered = NOUNS.filter(n => n.de.toLowerCase().includes(f) || n.ar.includes(currentSearch.trim()));
  const list = document.getElementById("nounList");
  list.innerHTML = filtered.map(n => '<div class="card noun" data-index="' + NOUNS.indexOf(n) + '"><button class="audio-btn" onclick="event.stopPropagation(); speak(\'' + n.de.replace('der ','').replace('die ','').replace('das ','') + '\')">🔊</button><div class="de">' + n.de + '</div><div class="ar">' + n.ar + '</div></div>').join("");
  list.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openNoun(+c.getAttribute("data-index"))));
  applyTranslationVisibility();
}
function renderAdjectives() {
  const f = currentSearch.trim().toLowerCase();
  const filtered = ADJECTIVES.filter(a => a.de.toLowerCase().includes(f) || a.ar.includes(currentSearch.trim()));
  const list = document.getElementById("adjList");
  list.innerHTML = filtered.map(a => '<div class="card adj" data-index="' + ADJECTIVES.indexOf(a) + '"><button class="audio-btn" onclick="event.stopPropagation(); speak(\'' + a.de + '\')">🔊</button><div class="de">' + a.de + '</div><div class="ar">' + a.ar + '</div></div>').join("");
  list.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openAdjective(+c.getAttribute("data-index"))));
  applyTranslationVisibility();
}
function openVerb(index) {
  const v = VERBS[index], label = typeLabels[v.type] || typeLabels.regular, hint = ruleHints[v.type] || "";
  const präsensHTML = v.präsens.map((form, i) => '<div class="conj-item"><span class="pron">' + pronouns[i] + '</span><span>' + form + '</span><button class="audio-btn" style="position:static; width:30px; height:30px; font-size:14px; margin-right:auto;" onclick="speak(\'' + pronouns[i] + ' ' + form + '\')">🔊</button></div>').join("");
  let badges = '<span class="badge ' + label.cls + '">' + label.text + '</span>';
  if (isDativ(v.de)) badges += '<span class="badge" style="background:#fce7f3;color:#9d174d;">📌 يأخذ Dativ</span>';
  if (isSein(v.de)) badges += '<span class="badge" style="background:#dbeafe;color:#1e40af;">✈️ يأخذ sein</span>';
  let exampleHTML = '';
  if (v.example) { exampleHTML = '<div class="section-title">💬 مثال في جملة</div><div class="example-box">' + v.example + '</div>'; }
  document.getElementById("modalContent").innerHTML = '<button class="close-btn" onclick="closeModal()">✕</button><div style="text-align:center; margin-bottom:20px;"><h2 style="display:inline-block; padding-left:0; margin-bottom:8px;">' + v.de + '</h2> <button class="audio-btn" style="position:static; display:inline-flex; vertical-align:middle; width:42px; height:42px; font-size:20px;" onclick="speak(\'' + v.de.replace(/ \(.*\)/, '') + '\')">🔊</button>' + (typeof translationHidden !== 'undefined' && translationHidden ? '' : '<div style="color:var(--text-muted); font-size:18px; font-weight:600; margin-top:5px;">' + v.ar + '</div>') + '<div style="margin-top:15px;">' + badges + '</div></div>' + (hint ? '<div class="rule-hint">' + hint + '</div>' : '') + '<div class="section-title">📘 المضارع (Präsens)</div><div class="conj-grid">' + präsensHTML + '</div><div class="section-title">⏳ الماضي البسيط (Präteritum)</div><div class="conj-item" style="margin-bottom:10px;"><span class="pron">er/sie/es</span><span>' + v.präteritum + '</span><button class="audio-btn" style="position:static; width:30px; height:30px; font-size:14px; margin-right:auto;" onclick="speak(\'' + v.präteritum + '\')">🔊</button></div><div class="section-title">✅ الماضي التام (Perfekt)</div><div class="conj-item" style="margin-bottom:10px;"><span class="pron">Perfekt</span><span>' + v.perfekt + '</span><button class="audio-btn" style="position:static; width:30px; height:30px; font-size:14px; margin-right:auto;" onclick="speak(\'' + v.perfekt + '\')">🔊</button></div><div class="conj-item"><span class="pron">Partizip II</span><span>' + v.partizip + '</span></div>' + exampleHTML;
  document.getElementById("modal").classList.add("active");
}
function openNoun(index) {
  const n = NOUNS[index];
  document.getElementById("modalContent").innerHTML = '<button class="close-btn" onclick="closeModal()">✕</button><div style="text-align:center; margin-bottom:20px;"><h2 style="display:inline-block; padding-left:0; margin-bottom:8px;">' + n.de + '</h2> <button class="audio-btn" style="position:static; display:inline-flex; vertical-align:middle; width:42px; height:42px; font-size:20px;" onclick="speak(\'' + n.de + '\')">🔊</button>' + (typeof translationHidden !== 'undefined' && translationHidden ? '' : '<div style="color:var(--text-muted); font-size:18px; font-weight:600; margin-top:5px;">' + n.ar + '</div>') + '</div><div class="section-title">📦 الجمع</div><div class="conj-item" style="margin-bottom:10px;"><span class="pron">Plural</span><span>' + n.plural + '</span><button class="audio-btn" style="position:static; width:30px; height:30px; font-size:14px; margin-right:auto;" onclick="speak(\'' + n.plural + '\')">🔊</button></div><div class="section-title">📐 الحالات الإعرابية</div><div class="info-block"><div class="info-item"><strong>Nominativ</strong>' + n.de + '</div><div class="info-item"><strong>Akkusativ</strong>' + n.akk + '</div><div class="info-item"><strong>Dativ</strong>' + n.dat + '</div></div>';
  document.getElementById("modal").classList.add("active");
}
function openAdjective(index) {
  const a = ADJECTIVES[index];
  document.getElementById("modalContent").innerHTML = '<button class="close-btn" onclick="closeModal()">✕</button><div style="text-align:center; margin-bottom:20px;"><h2 style="display:inline-block; padding-left:0; margin-bottom:8px;">' + a.de + '</h2> <button class="audio-btn" style="position:static; display:inline-flex; vertical-align:middle; width:42px; height:42px; font-size:20px;" onclick="speak(\'' + a.de + '\')">🔊</button>' + (typeof translationHidden !== 'undefined' && translationHidden ? '' : '<div style="color:var(--text-muted); font-size:18px; font-weight:600; margin-top:5px;">' + a.ar + '</div>') + '</div><div class="rule-hint">الصفات تُصرَّف حسب الحالة والجنس والعدد عند استخدامها قبل الاسم، وتبقى بدون تصريف عند استخدامها كخبر.</div>';
  document.getElementById("modal").classList.add("active");
}
function closeModal() { document.getElementById("modal").classList.remove("active"); }
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add("hidden"));
  document.getElementById("tab-" + name).classList.remove("hidden");
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.getAttribute("data-tab") === name));
  document.getElementById("verbFilters").style.display = (name === "verbs") ? "flex" : "none";
  document.getElementById("search").style.display = (name === "verbs" || name === "nouns" || name === "adjectives") ? "block" : "none";
  if (name === "flashcards") newCard();
  else if (name === "verbs" || name === "nouns" || name === "adjectives") renderCurrent();
  else if (name === "rules") document.getElementById("rulesContent").innerHTML = RULES_HTML;
  else if (name === "speaking") { loadShadow(); loadChallenge(); }
  else if (name === "exercises") { startExercises(); }
  else if (name === "writing") { initWritingTab(); }
  else if (name === "listening") { initListeningTab(); }
  else if (name === "dialogues") { initDialoguesTab(); }
  else if (name === "basics") { initBasicsTab(); }
  else if (name === "progress") { initProgressTab(); }
  else if (name === "resources") { renderResources(); }
  else if (name === "review") { initReviewTab(); }
}
function renderCurrent() {
  if (currentTab === "verbs") renderVerbs(); else if (currentTab === "nouns") renderNouns(); else if (currentTab === "adjectives") renderAdjectives();
}
let currentCard = null, isFlipped = false;
function newCard() { const v = VERBS[Math.floor(Math.random() * VERBS.length)]; currentCard = v; isFlipped = false; document.getElementById("card-front").innerText = v.ar; document.getElementById("card-back").innerText = v.de; document.getElementById("card-front").style.display = "block"; document.getElementById("card-back").style.display = "none"; }
function flipCard() { if (!currentCard) return; isFlipped = !isFlipped; document.getElementById("card-front").style.display = isFlipped ? "none" : "block"; document.getElementById("card-back").style.display = isFlipped ? "block" : "none"; if (isFlipped) speak(currentCard.de.replace(/ \(.*\)/, '')); }
function nextCard() { newCard(); }
document.addEventListener('click', function(e) { if (e.target.tagName === 'H3' && e.target.parentElement.classList.contains('rule-section')) { e.target.parentElement.classList.toggle('open'); } });
let currentShadow = 0, currentChallenge = 0;
function switchSpeakingMode(mode) {
  document.querySelectorAll('#tab-speaking .filter-btn').forEach(b => b.classList.remove('active'));
  if (mode === 'shadowing') { document.querySelector('#tab-speaking .filter-btn:nth-child(1)').classList.add('active'); document.getElementById('shadowingSection').classList.remove('hidden'); document.getElementById('challengeSection').classList.add('hidden'); loadShadow(); }
  else { document.querySelector('#tab-speaking .filter-btn:nth-child(2)').classList.add('active'); document.getElementById('challengeSection').classList.remove('hidden'); document.getElementById('shadowingSection').classList.add('hidden'); loadChallenge(); }
}
function loadShadow() { const s = SHADOWING_DATA[currentShadow]; document.getElementById('shadowDe').innerText = s.de; document.getElementById('shadowAr').innerText = s.ar; document.getElementById('shadowCounter').innerText = 'الجملة ' + (currentShadow + 1) + ' من ' + SHADOWING_DATA.length; }
function nextShadow() { currentShadow = (currentShadow + 1) % SHADOWING_DATA.length; loadShadow(); }
function loadChallenge() { const c = SPEAKING_CHALLENGES[currentChallenge]; document.getElementById('challengeQ').innerText = c.q; document.getElementById('challengeQAr').innerText = c.qAr; document.getElementById('challengeA').innerText = c.a; document.getElementById('challengeAAr').innerText = c.aAr; document.getElementById('challengeAnsBox').style.display = 'none'; }
function showAnswer() { document.getElementById('challengeAnsBox').style.display = 'block'; }
function nextChallenge() { currentChallenge = (currentChallenge + 1) % SPEAKING_CHALLENGES.length; loadChallenge(); }
function renderResources() {
  const container = document.getElementById('resourcesGrid');
  if (typeof RESOURCES === 'undefined') { container.innerHTML = '<p style="text-align:center; color:#dc2626;">⚠️ ملف المصادر غير محمّل.</p>'; return; }
  container.innerHTML = RESOURCES.map(r => '<a href="' + r.url + '" target="_blank" rel="noopener" style="text-decoration:none;"><div style="background:#fff; padding:22px; border-radius:14px; border-right:5px solid #4f46e5; height:100%; display:flex; flex-direction:column;"><h3 style="color:#1e3a8a; font-size:18px; margin-bottom:10px; font-weight:700;">' + r.icon + ' ' + r.title + '</h3><p style="color:#64748b; font-size:14px; line-height:1.6; flex-grow:1;">' + r.description + '</p><span style="color:#4f46e5; font-weight:700; font-size:14px; margin-top:12px;">زيارة المصدر ↗️</span></div></a>').join('');
}
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.getAttribute("data-tab"))));
document.querySelectorAll(".filter-btn").forEach(b => b.addEventListener("click", () => { document.querySelectorAll(".filter-btn").forEach(x => x.classList.remove("active")); b.classList.add("active"); currentFilter = b.getAttribute("data-filter"); renderVerbs(); }));
document.getElementById("search").addEventListener("input", e => { currentSearch = e.target.value; renderCurrent(); });
renderVerbs();
</script>
</body>
</html>
