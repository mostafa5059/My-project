<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأفعال والمفردات الألمانية A1 - A2.2</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary:#4f46e5; --primary-light:#818cf8; --primary-dark:#3730a3; --accent:#10b981; --bg-color:#f1f5f9; --card-bg:#fff; --text-main:#0f172a; --text-muted:#64748b; --border-color:#e2e8f0; --radius-lg:16px; --radius-xl:24px; --transition:all .3s ease; }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',Tahoma,sans-serif}
  body{background:var(--bg-color);color:var(--text-main);line-height:1.7;overflow-x:hidden}
  header{background:linear-gradient(135deg,#1e1b4b,#4f46e5);color:#fff;padding:40px 20px;text-align:center;border-bottom-left-radius:var(--radius-xl);border-bottom-right-radius:var(--radius-xl);position:relative}
  header h1{font-size:28px;font-weight:700;margin-bottom:10px}
  header p{font-size:16px;opacity:.9}
  .lang-buttons{position:absolute;top:20px;left:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .lang-btn{background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.4);padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:700;font-size:14px;font-family:'Cairo',sans-serif;transition:var(--transition)}
  .lang-btn:hover{background:rgba(255,255,255,.35)}
  .container{max-width:1250px;margin:0 auto;padding:30px 20px}
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px;justify-content:center}
  .tab{padding:12px 24px;border:none;background:var(--card-bg);color:var(--text-muted);border-radius:30px;cursor:pointer;font-size:15px;font-weight:600;border:1px solid var(--border-color);transition:var(--transition)}
  .tab:hover{border-color:var(--primary-light)}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .controls{margin-bottom:25px;max-width:600px;margin-left:auto;margin-right:auto}
  .controls input{width:100%;padding:16px 24px;border:2px solid var(--border-color);border-radius:20px;font-size:16px;outline:none;transition:var(--transition)}
  .controls input:focus{border-color:var(--primary)}
  .filter-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px;justify-content:center}
  .filter-btn{padding:8px 18px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-muted);border-radius:20px;cursor:pointer;font-size:14px;font-weight:600;transition:var(--transition)}
  .filter-btn:hover{border-color:var(--primary-light)}
  .filter-btn.active{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark)}
  .list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .card{background:var(--card-bg);padding:22px;border-radius:var(--radius-lg);cursor:pointer;border-right:6px solid var(--primary);position:relative;border:1px solid var(--border-color);transition:var(--transition)}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(79,70,229,.15)}
  .card.noun{border-right-color:var(--accent)}
  .card.adj{border-right-color:#f59e0b}
  .card .de{font-weight:800;font-size:22px;color:var(--primary-dark);margin-bottom:6px;direction:ltr;text-align:right;padding-left:40px}
  .card .ar{font-size:15px;color:var(--text-muted);font-weight:600}
  .card.noun .de{color:#047857}
  .card.adj .de{color:#b45309}
  .audio-btn{position:absolute;top:16px;left:16px;background:#f1f5f9;border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--primary);transition:var(--transition)}
  .audio-btn:hover{background:#e0e7ff}
  .fav-btn{position:absolute;top:16px;left:60px;background:#fef3c7;border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:#d97706;transition:var(--transition)}
  .fav-btn:hover{background:#fde68a}
  .hidden{display:none!important}
  .modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:100;padding:20px;overflow-y:auto}
  .modal.active{display:flex;align-items:center;justify-content:center}
  .modal-content{background:var(--card-bg);border-radius:var(--radius-xl);max-width:680px;width:100%;padding:35px;position:relative;max-height:90vh;overflow-y:auto}
  .close-btn{position:absolute;top:20px;left:20px;background:#fee2e2;color:#dc2626;border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700}
  .modal-content h2{color:var(--primary-dark);margin-bottom:10px;display:inline-block;font-size:32px;font-weight:800}
  .badge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;margin:6px 6px 15px 0}
  .badge.trennbar{background:#dbeafe;color:#1e40af}
  .badge.reflexiv{background:#fce7f3;color:#9d174d}
  .badge.unregelmäßig{background:#fef3c7;color:#92400e}
  .badge.regular{background:#dcfce7;color:#166534}
  .rule-hint{background:#fffbeb;border-right:4px solid #f59e0b;padding:14px 18px;border-radius:10px;font-size:14px;color:#92400e;margin-bottom:20px}
  .section-title{font-size:16px;font-weight:700;color:var(--primary);margin:25px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--border-color)}
  .conj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .conj-item{background:#fff;padding:14px 18px;border-radius:10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border-color);font-weight:600}
  .conj-item .pron{color:var(--primary-dark);font-weight:700;min-width:80px;direction:rtl}
  .conj-item span:not(.pron){direction:ltr;text-align:left;font-weight:700}
  .meta{background:#eff6ff;padding:16px;border-radius:12px;margin-top:10px;font-size:15px;border:1px solid #bfdbfe;font-weight:600}
  .info-block{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .info-item{background:#f0fdf4;padding:14px 18px;border-radius:12px;font-size:15px;border-right:5px solid var(--accent);font-weight:600}
  .info-item strong{color:#065f46;display:block;font-size:13px;margin-bottom:6px}
  .rules-container{background:var(--card-bg);padding:40px;border-radius:var(--radius-xl);border:1px solid var(--border-color)}
  .rule-section{border-bottom:1px solid var(--border-color);padding-bottom:30px;margin-bottom:30px}
  .rule-section:last-child{border-bottom:none}
  .rule-section h3{color:var(--primary-dark);margin-bottom:15px;font-size:22px;border-right:6px solid var(--primary);padding:20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border-radius:14px;font-weight:800}
  .rule-section h3::after{content:'▼';font-size:16px;color:var(--primary);transition:var(--transition)}
  .rule-section.open h3::after{transform:rotate(180deg)}
  .rule-content{display:none;padding:30px;background:#fff;border:1px solid var(--border-color);border-radius:14px;margin-top:20px}
  .rule-section.open .rule-content{display:block}
  .rule-content p{font-size:17px;color:var(--text-main);margin-bottom:18px;line-height:2}
  .rule-content ul{padding-right:25px;margin-bottom:25px}
  .rule-content li{font-size:16px;color:var(--text-main);margin-bottom:14px;line-height:1.9}
  .rule-content code{background:#eff6ff;color:var(--primary-dark);padding:5px 12px;border-radius:8px;font-family:'Courier New',monospace;font-weight:bold;font-size:15px}
  .example-box{background:#f0fdf4;border-right:5px solid var(--accent);padding:25px 30px;margin:25px 0;border-radius:12px;font-size:16px;line-height:2.1}
  .example-box strong{color:#047857;font-weight:800}
  table{width:100%;border-collapse:collapse;margin:25px 0;font-size:15px;border:1px solid var(--border-color)}
  th,td{border:1px solid var(--border-color);padding:14px;text-align:center}
  th{background:#eff6ff;color:var(--primary-dark);font-weight:700}
  .flashcard-container{max-width:550px;margin:40px auto}
  .flashcard{background:var(--card-bg);border-radius:var(--radius-xl);padding:60px 30px;cursor:pointer;min-height:280px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px solid var(--border-color);transition:var(--transition)}
  .flashcard:hover{border-color:var(--primary-light)}
  .flashcard-front{color:var(--primary-dark);font-size:36px;font-weight:700}
  .flashcard-back{color:var(--accent);font-size:36px;font-weight:700;display:none}
  .flashcard-hint{color:#94a3b8;font-size:16px;margin-top:25px;font-weight:600}
  .btn-next{display:block;margin:35px auto;padding:16px 45px;background:var(--primary);color:#fff;border:none;border-radius:30px;cursor:pointer;font-size:18px;font-weight:700;transition:var(--transition)}
  .btn-next:hover{background:var(--primary-dark)}
  .placeholder-tab{background:#fff;padding:50px 30px;border-radius:var(--radius-xl);text-align:center;border:2px dashed var(--border-color)}
  .placeholder-tab h3{color:var(--primary-dark);font-size:22px;margin-bottom:15px}
  .placeholder-tab p{color:var(--text-muted);font-size:16px}

  /* ============ الوضع الليلي ============ */
  body.dark-mode{--bg-color:#0f172a;--card-bg:#1e293b;--text-main:#f1f5f9;--text-muted:#94a3b8;--border-color:#334155;background:#0f172a;color:#f1f5f9}
  body.dark-mode header{background:linear-gradient(135deg,#0f172a,#312e81)}
  body.dark-mode .card{background:#1e293b;border-color:#334155}
  body.dark-mode .card .de{color:#a5b4fc}
  body.dark-mode .card.noun .de{color:#6ee7b7}
  body.dark-mode .card.adj .de{color:#fcd34d}
  body.dark-mode .tab{background:#1e293b;color:#94a3b8;border-color:#334155}
  body.dark-mode .tab.active{background:#4f46e5;color:#fff}
  body.dark-mode .controls input{background:#1e293b;color:#f1f5f9;border-color:#334155}
  body.dark-mode .filter-btn{background:#1e293b;color:#94a3b8;border-color:#334155}
  body.dark-mode .filter-btn.active{background:#3730a3;color:#fff}
  body.dark-mode .modal-content{background:#1e293b;color:#f1f5f9}
  body.dark-mode .modal-content h2{color:#a5b4fc}
  body.dark-mode .section-title{color:#a5b4fc;border-bottom-color:#334155}
  body.dark-mode .conj-item{background:#0f172a;border-color:#334155;color:#f1f5f9}
  body.dark-mode .conj-item .pron{color:#a5b4fc}
  body.dark-mode .example-box{background:#064e3b;border-right-color:#10b981;color:#f1f5f9}
  body.dark-mode .example-box strong{color:#6ee7b7}
  body.dark-mode .info-item{background:#064e3b;color:#f1f5f9}
  body.dark-mode .info-item strong{color:#6ee7b7}
  body.dark-mode table{border-color:#334155}
  body.dark-mode th{background:#1e293b;color:#a5b4fc}
  body.dark-mode td{border-color:#334155;color:#f1f5f9}
  body.dark-mode .rules-container{background:#1e293b;border-color:#334155}
  body.dark-mode .rule-section h3{background:#0f172a;color:#a5b4fc}
  body.dark-mode .rule-content{background:#0f172a;border-color:#334155;color:#f1f5f9}
  body.dark-mode .rule-content p,body.dark-mode .rule-content li{color:#f1f5f9}
  body.dark-mode .rule-content code{background:#1e293b;color:#a5b4fc}
  body.dark-mode .flashcard{background:#1e293b;border-color:#334155}
  body.dark-mode .flashcard-front{color:#a5b4fc}
  body.dark-mode .audio-btn{background:#334155;color:#a5b4fc}
  body.dark-mode .fav-btn{background:#78350f;color:#fcd34d}
  body.dark-mode .badge.regular{background:#064e3b;color:#6ee7b7}
  body.dark-mode .badge.unregelmäßig{background:#78350f;color:#fcd34d}
  body.dark-mode .badge.trennbar{background:#1e3a8a;color:#93c5fd}
  body.dark-mode .badge.reflexiv{background:#831843;color:#f9a8d4}
  body.dark-mode .rule-hint{background:#78350f;color:#fcd34d}
  body.dark-mode .placeholder-tab{background:#1e293b;border-color:#334155}

  /* ============ بطاقات الدروس ============ */
  .lessons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .lesson-card{background:var(--card-bg);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;border:1px solid var(--border-color);border-right:6px solid var(--primary);transition:var(--transition)}
  .lesson-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(79,70,229,.18)}
  .lesson-img-wrap{width:100%;height:160px;background:#e0e7ff;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .lesson-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
  .lesson-body{padding:16px 18px}
  .lesson-level{display:inline-block;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:800;padding:3px 10px;border-radius:10px;margin-bottom:8px}
  .lesson-title{color:var(--primary-dark);font-size:18px;font-weight:800;direction:ltr;text-align:right;margin-bottom:4px}
  .lesson-title-ar{color:var(--text-muted);font-size:14px;font-weight:600;margin-bottom:10px}
  .lesson-topic{display:inline-block;background:#f0fdf4;color:#065f46;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;margin-left:6px}
  .lesson-words-count{display:inline-block;background:#fef3c7;color:#92400e;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px}
  body.dark-mode .lesson-card{background:#1e293b;border-color:#334155}
  body.dark-mode .lesson-title{color:#a5b4fc}
  body.dark-mode .lesson-img-wrap{background:#0f172a}
  body.dark-mode .lesson-level{background:#1e3a8a;color:#93c5fd}
  body.dark-mode .lesson-topic{background:#064e3b;color:#6ee7b7}
  body.dark-mode .lesson-words-count{background:#78350f;color:#fcd34d}

  @media (max-width:768px){
    header{padding:25px 15px;padding-top:100px}
    .lang-buttons{top:15px;left:15px;right:15px;justify-content:center}
    .tabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:10px}
    .tabs::-webkit-scrollbar{display:none}
    .tab{padding:10px 16px;font-size:13px;white-space:nowrap;flex-shrink:0}
    .list-grid{grid-template-columns:1fr;gap:12px}
    .conj-grid{grid-template-columns:1fr}
    .modal-content{padding:20px 15px;border-radius:16px}
    .modal-content h2{font-size:24px}
    .info-block{grid-template-columns:1fr}
    .fav-btn{left:60px}
  }

  /* ============================================================
     ✅ إضافات جديدة: Sidebar + Language Dropdown
     ============================================================ */
  :root {
    --sidebar-width: 260px;
    --sidebar-bg: #ffffff;
    --sidebar-border: #e2e8f0;
    --sidebar-item-hover: #eef2ff;
    --sidebar-item-active-bg: #4f46e5;
    --sidebar-item-active-color: #ffffff;
    --sidebar-group-title: #64748b;
  }
  body.dark-mode {
    --sidebar-bg: #1e293b;
    --sidebar-border: #334155;
    --sidebar-item-hover: #334155;
    --sidebar-item-active-bg: #6366f1;
    --sidebar-group-title: #94a3b8;
  }

  .tabs#mainTabs { display: none !important; }

  .app-layout {
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .app-layout { grid-template-columns: 1fr; }
  }

  .sidebar {
    background: var(--sidebar-bg);
    border: 1px solid var(--sidebar-border);
    border-radius: var(--radius-lg);
    padding: 14px 10px;
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    transition: transform .3s ease;
    z-index: 50;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--sidebar-border); border-radius: 3px; }

  .sidebar-group { margin-bottom: 14px; }
  .sidebar-group-title {
    font-size: 12px;
    font-weight: 800;
    color: var(--sidebar-group-title);
    padding: 6px 12px 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 14px;
    border: none;
    background: transparent;
    color: var(--text-main);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: right;
    border-radius: 10px;
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
    margin-bottom: 2px;
  }
  .sidebar-item:hover { background: var(--sidebar-item-hover); }
  .sidebar-item.active {
    background: var(--sidebar-item-active-bg);
    color: var(--sidebar-item-active-color);
  }
  .sidebar-item.disabled { opacity: 0.5; cursor: not-allowed; }
  .sidebar-item.disabled:hover { background: transparent; }
  .sidebar-item .emoji { font-size: 16px; flex-shrink: 0; }

  .sidebar-toggle {
    display: none;
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 60;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(79,70,229,.4);
    align-items: center;
    justify-content: center;
  }
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.5);
    z-index: 40;
  }
  @media (max-width: 900px) {
    .sidebar-toggle { display: flex; }
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      max-height: 100vh;
      width: 280px;
      border-radius: 0;
      transform: translateX(100%);
      box-shadow: -4px 0 20px rgba(0,0,0,.2);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.active { display: block; }
    .app-layout { gap: 0; }
  }

  /* ============ Language Dropdown ============ */
  .lang-dropdown-wrap { position: relative; display: inline-block; }
  .lang-dropdown-btn {
    background: rgba(255,255,255,.2);
    color: #fff;
    border: 2px solid rgba(255,255,255,.4);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    font-family: 'Cairo', sans-serif;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .lang-dropdown-btn:hover { background: rgba(255,255,255,.35); }
  .lang-dropdown-btn .caret { font-size: 10px; opacity: .8; }

  .lang-dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 160px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,.15);
    overflow: hidden;
    z-index: 100;
  }
  .lang-dropdown-menu.open { display: block; }
  .lang-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 10px 14px;
    border: none;
    background: transparent;
    color: var(--text-main);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: right;
    transition: background .15s ease;
  }
  .lang-option:hover { background: var(--sidebar-item-hover); }
  .lang-option.active { color: var(--primary); font-weight: 800; }
  .lang-option .check { font-weight: 800; color: var(--primary); }

  #langSwitchBtn, #contentLangBtn, #currentLangLabel { display: none !important; }

  /* ============================================================
   CSS لبطاقات القواعد A1 (grammar_a1.js)
   ============================================================ */
  .grammar-a1-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 10px; }
  .grammar-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; transition: all .25s ease; border-right: 5px solid var(--primary); }
  .grammar-card:hover { box-shadow: 0 6px 18px rgba(79,70,229,.12); transform: translateY(-2px); }
  .grammar-card.cat-basics { border-right-color: #3b82f6; }
  .grammar-card.cat-grammar { border-right-color: #8b5cf6; }
  .grammar-card.cat-communication { border-right-color: #10b981; }
  .grammar-card.cat-life { border-right-color: #f59e0b; }
  .grammar-card.cat-time { border-right-color: #ec4899; }
  .grammar-card-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; user-select: none; background: #f8fafc; transition: background .2s ease; }
  .grammar-card-header:hover { background: #eef2ff; }
  .grammar-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 13px; font-weight: 800; flex-shrink: 0; }
  .grammar-icon { font-size: 22px; flex-shrink: 0; }
  .grammar-titles { flex: 1; min-width: 0; }
  .grammar-title-de { font-size: 15px; font-weight: 800; color: var(--primary-dark); direction: ltr; text-align: right; margin-bottom: 2px; }
  .grammar-title-ar { font-size: 13px; font-weight: 600; color: var(--text-muted); }

<script>
/* ==================== الحالة ==================== */
let contentLanguage = localStorage.getItem('content_language') || 'de';
let translationVisible = localStorage.getItem('translation_visible') !== 'false';
let currentTab = "verbs", currentFilter = "all", currentSearch = "", currentTopic = "all";

const pronouns = ["ich","du","er/sie/es","wir","ihr","sie/Sie"];
const typeLabels = {regular:{text:"منتظم",cls:"regular"},unregelmäßig:{text:"⚡ غير منتظم",cls:"unregelmäßig"},trennbar:{text:"🔹 منفصل",cls:"trennbar"},reflexiv:{text:"🔄 انعكاسي",cls:"reflexiv"}};
const ruleHints = {unregelmäßig:"⚡ فعل غير منتظم: تتغير حركة الجذر في المضارع (du/er) وفي الماضي.",trennbar:"🔹 فعل منفصل: البادئة تُنقل لنهاية الجملة (مثل: stehe auf).",reflexiv:"🔄 فعل انعكاسي: يحتاج ضميراً انعكاسياً (mich/dich/sich...)."};

const isDativ = (de) => ["helfen","danken","gefallen","gehören","passen","antworten","zuhören","empfehlen","schmecken"].includes(de.replace(" (Dativ)",""));
const isSein = (de) => ["aufstehen","ausgehen","einsteigen","aussteigen","umsteigen","ankommen","mitkommen","zurückkommen","laufen","reisen","wandern","gehen","kommen","fahren","fliegen","werden","sein"].includes(de.replace(" (sein)",""));

/* ==================== المساعدة ==================== */
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('المتصفح لا يدعم النطق الصوتي.'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
function closeModal() { document.getElementById("modal").classList.remove("active"); }
function openModal(html) { document.getElementById("modalContent").innerHTML = html; document.getElementById("modal").classList.add("active"); }
function applyTranslationVisibility() {
  document.querySelectorAll('.card .ar').forEach(el => el.style.display = translationVisible ? 'block' : 'none');
  document.querySelectorAll('.modal-content .ar, .modal-content .arabic, .modal-content .ar-translation, .modal-content .trans').forEach(el => el.style.display = translationVisible ? 'block' : 'none');
  document.querySelectorAll('.trans').forEach(el => el.style.display = translationVisible ? 'block' : 'none');
}

/* ==================== الوضع الليلي ==================== */
function toggleDarkMode() {
  const isDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem('dark_mode', isDark ? 'true' : 'false');
  updateDarkModeBtn();
}
function updateDarkModeBtn() {
  const btn = document.getElementById('darkModeBtn');
  if (btn) btn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
}
function applyDarkMode() {
  const isDark = localStorage.getItem('dark_mode') === 'true';
  if (isDark) document.body.classList.add('dark-mode');
  updateDarkModeBtn();
}

/* ==================== المفضلة ==================== */
function getFavorites() { try { const d = localStorage.getItem('favorites'); return d ? JSON.parse(d) : {}; } catch(e) { return {}; } }
function saveFavorites(data) { localStorage.setItem('favorites', JSON.stringify(data)); }
function isFavorite(key) { return !!getFavorites()[key]; }
function toggleFavorite(key, btnEl) {
  const favs = getFavorites();
  if (favs[key]) { delete favs[key]; if (btnEl) btnEl.textContent = '☆'; }
  else { favs[key] = { added: Date.now() }; if (btnEl) btnEl.textContent = '⭐'; }
  saveFavorites(favs);
}

/* ==================== أزرار المواضيع ==================== */
function buildTopicFilters(tabName) {
  const container = document.getElementById('topicFilters');
  if (!container) return;
  
  if (currentTopic !== "all") {
    container.style.display = 'none';
    return;
  }

  let sourceData = [];
  if (tabName === 'verbs') sourceData = (contentLanguage === 'en' && typeof VERBS_EN !== 'undefined') ? VERBS_EN : (typeof VERBS !== 'undefined' ? VERBS : []);
  else if (tabName === 'nouns') sourceData = (contentLanguage === 'en' && typeof NOUNS_EN !== 'undefined') ? NOUNS_EN : (typeof NOUNS !== 'undefined' ? NOUNS : []);
  else if (tabName === 'adjectives') sourceData = (typeof ADJECTIVES !== 'undefined' ? ADJECTIVES : []);
  else { container.style.display = 'none'; return; }

  const topics = {};
  sourceData.forEach(item => {
    const t = item.topic || 'عام';
    if (!topics[t]) topics[t] = 0;
    topics[t]++;
  });

  if (Object.keys(topics).length === 0) { container.style.display = 'none'; return; }

  container.style.display = 'block';
  
  const icons = {
    'عائلة': '👨‍👩‍👧', 'مهن': '💼', 'طعام': '🍔', 'حياة': '🌱', 'رياضة': '⚽', 
    'لغة': '📚', 'دراسة': '🎓', 'حركة': '🏃', 'تواصل': '💬', 'سفر': '✈️', 
    'تسوق': '🛒', 'فن': '🎨', 'منزل': '🏠', 'صفات': '✨', 'ظروف': '🕒',
    'سكن': '🏡', 'أثاث': '🛋️', 'حروف جر': '🔗', 'مشاعر': '❤️', 'علاقات': '🤝',
    'مناسبات': '🎉', 'وقت': '⏱️', 'أماكن': '📍', 'طبيعة': '🌳', 'جغرافيا': '🗺️',
    'عمل': '💼', 'ألوان': '🎨', 'طقس': '🌤️', 'عام': '📁'
  };

  let html = '<div class="topic-grid">';
  Object.keys(topics).forEach(t => {
    const icon = icons[t] || '📁';
    html += `
      <div class="topic-card" onclick="switchTopic('${t}')">
        <div class="topic-icon">${icon}</div>
        <div class="topic-name">${t}</div>
        <div class="topic-count">${topics[t]} كلمة</div>
      </div>
    `;
  });
  html += '</div>';
  
  container.innerHTML = html;
}
function switchTopic(topic) {
  currentTopic = topic;
  
  const container = document.getElementById('topicFilters');
  if (topic !== "all") {
    container.style.display = 'block';
    container.innerHTML = `
      <button class="filter-btn" onclick="switchTopic('all')" style="background:var(--primary);color:#fff;border:none;padding:10px 20px;border-radius:20px;font-weight:700;cursor:pointer;margin-bottom:15px;display:inline-flex;align-items:center;gap:8px;">
        ← العودة لكل المواضيع
      </button>
      <span style="font-weight:800;font-size:18px;color:var(--primary-dark);">📂 ${topic}</span>
    `;
  } else {
    container.innerHTML = '';
    buildTopicFilters(currentTab);
  }

  if (currentTab === 'verbs') renderVerbs();
  else if (currentTab === 'nouns') renderNouns();
  else if (currentTab === 'adjectives') renderAdjectives();
}

/* ==================== الأفعال ==================== */
function renderVerbs() {
  const f = currentSearch.trim().toLowerCase();
  const sourceData = contentLanguage === 'en' ? (typeof VERBS_EN !== 'undefined' ? VERBS_EN : []) : (typeof VERBS !== 'undefined' ? VERBS : []);
  const list = document.getElementById("verbList");
  const filtered = sourceData.filter(v => {
    const word = contentLanguage === 'en' ? v.en : v.de;

function renderFavorites() {
  const favs = getFavorites();
  const keys = Object.keys(favs);
  const list = document.getElementById('favList');
  if (!list) return;
  if (!keys.length) {
    list.innerHTML = '<p style="text-align:center;color:#64748b;grid-column:1/-1;">لا توجد عناصر في المفضلة بعد. اضغط ☆ بجانب أي كلمة لإضافتها.</p>';
    return;
  }
  let html = '';
  keys.forEach(key => {
    const parts = key.split('::');
    const type = parts[0], word = parts[1];
    let sourceData = [];
    if (type === 'verb') sourceData = (contentLanguage === 'en' && typeof VERBS_EN !== 'undefined') ? VERBS_EN : (typeof VERBS !== 'undefined' ? VERBS : []);
    else if (type === 'noun') sourceData = (contentLanguage === 'en' && typeof NOUNS_EN !== 'undefined') ? NOUNS_EN : (typeof NOUNS !== 'undefined' ? NOUNS : []);
    const item = sourceData.find(x => x.de === word || x.en === word);
    if (!item) return;
    const idx = sourceData.indexOf(item);
    const displayWord = contentLanguage === 'en' ? item.en : item.de;
    const typeClass = type === 'noun' ? 'noun' : '';
    const clean = displayWord.replace(/^(der|die|das) /, '');
    html += `<div class="card ${typeClass}" data-index="${idx}" data-type="${type}">
      <button class="audio-btn" onclick="event.stopPropagation(); speak('${clean.replace(/'/g, "\\'")}')">🔊</button>
      <button class="fav-btn" onclick="event.stopPropagation(); toggleFavorite('${key.replace(/'/g, "\\'")}', this); setTimeout(renderFavorites, 150);">⭐</button>
      <div class="de">${displayWord}</div><div class="ar">${item.ar}</div>
    </div>`;
  });
  list.innerHTML = html || '<p style="text-align:center;color:#64748b;grid-column:1/-1;">لا توجد عناصر مطابقة للغة الحالية.</p>';
  list.querySelectorAll('.card').forEach(c => {
    c.addEventListener('click', () => {
      const type = c.dataset.type;
      const idx = +c.dataset.index;
      if (type === 'verb') openVerb(idx);
      else if (type === 'noun') openNoun(idx);
      else if (type === 'adj') openAdjective(idx);
    });
  });
  applyTranslationVisibility();
}

function switchTab(name) {
    // 👇 الكود الجديد الذي يغلق القائمة فوراً
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (sidebar) sidebar.classList.remove('open');
  if (overlay) overlay.classList.remove('active');
  // 👆 نهاية الكود الجديد
  if (!history.state || history.state.tab !== name) {
    history.pushState({ tab: name }, "", "#" + name);
  }
  currentTab = name;
  document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add("hidden"));
  const target = document.getElementById("tab-" + name);
  if (target) target.classList.remove("hidden");
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  document.querySelectorAll(".sidebar-item").forEach(b => b.classList.toggle("active", b.dataset.tab === name));

  const filters = document.getElementById("verbFilters");
  const search = document.getElementById("searchWrap");
  if (filters) filters.style.display = (name === "verbs") ? "flex" : "none";
  if (search) search.style.display = (name === "verbs" || name === "nouns" || name === "adjectives") ? "block" : "none";

  currentTopic = 'all';
  if (name === 'verbs' || name === 'nouns' || name === 'adjectives') buildTopicFilters(name);
  else { const tf = document.getElementById('topicFilters'); if (tf) tf.style.display = 'none'; }

  try {
    if (name === "verbs") renderVerbs();
    else if (name === "nouns") renderNouns();
    else if (name === "adjectives") renderAdjectives();
    else if (name === "favorites") renderFavorites();
    else if (name === "flashcards") { if (typeof newCard === 'function') newCard(); }
    else if (name === "speaking") { if (typeof loadShadow === 'function') loadShadow(); if (typeof loadChallenge === 'function') loadChallenge(); }
    else if (name === "exercises") { if (typeof startExercises === 'function') startExercises(); }
    else if (name === "writing") { if (typeof initWritingTab === 'function') initWritingTab(); }
    else if (name === "listening") { if (typeof initListeningTab === 'function') initListeningTab(); }
    else if (name === "dialogues") { if (typeof initDialoguesTab === 'function') initDialoguesTab(); }
    else if (name === "basics") { if (typeof initBasicsTab === 'function') initBasicsTab(); }
    else if (name === "reading") { if (typeof initReadingTab === 'function') initReadingTab(); }
    else if (name === "progress") { if (typeof initProgressTab === 'function') initProgressTab(); }
    else if (name === "lessons") { if (typeof initLessonsTab === 'function') initLessonsTab(); }
    else if (name === "pronunciation") { if (typeof initPronunciationTab === 'function') initPronunciationTab(); }
    else if (name === "rules") { if (typeof renderRules === 'function') renderRules(); else { const rc = document.getElementById("rulesContent"); if (rc) rc.innerHTML = (contentLanguage === 'en' && typeof RULES_HTML_EN !== 'undefined') ? RULES_HTML_EN : (typeof RULES_HTML !== 'undefined' ? RULES_HTML : ''); } }
    else if (name === "grammar-a1") { if (typeof initGrammarA1Tab === 'function') initGrammarA1Tab(); }
    else if (name === "grammar-a2") { if (typeof initGrammarA2Tab === 'function') initGrammarA2Tab(); }
    else if (name === "resources") { if (typeof renderResources === 'function') renderResources(); }
    else if (name === "review") { if (typeof initReviewTab === 'function') initReviewTab(); }
  } catch(e) { console.error('switchTab(' + name + '):', e); }
  applyTranslationVisibility();
}

// دالة التحقق من الإجابة (تستخدم ex.answer)
function checkGrammarExercise(btn, selected, correct) {
    // 1. إيجاد الحاوية الرئيسية للسؤال
    const parent = btn.closest('.exercise-block');
    if (!parent) return;
    
    // 2. إيجاد شرح السؤال وجميع الأزرار
    const explanation = parent.querySelector('.exercise-explanation');
    const buttons = parent.querySelectorAll('.exercise-options button');
    
    // 3. تعطيل جميع الأزرار بعد الاختيار
    buttons.forEach(b => {
        b.disabled = true;
        b.classList.add('disabled'); // اختياري لتأثير بصري
    });

    // 4. تلوين الإجابات باستخدام الكلاسات (CSS)
    if (selected === correct) {
        btn.classList.add('correct');
    } else {
        btn.classList.add('wrong');
        // تلوين الإجابة الصحيحة بالأخضر تلقائياً
        if (buttons[correct]) {
            buttons[correct].classList.add('correct');
        }
    }
    
    // 5. إظهار الشرح
    if (explanation) {
        explanation.style.display = 'block';
    }
}

  try {
    if (currentTab === 'verbs') { currentTopic = 'all'; buildTopicFilters('verbs'); renderVerbs(); }
    else if (currentTab === 'nouns') { currentTopic = 'all'; buildTopicFilters('nouns'); renderNouns(); }
    else if (currentTab === 'adjectives') renderAdjectives();
    else if (currentTab === 'favorites') renderFavorites();
    else if (currentTab === 'lessons') { if (typeof initLessonsTab === 'function') initLessonsTab(); }
    else if (currentTab === 'rules') { const rc = document.getElementById('rulesContent'); if (rc) rc.innerHTML = (contentLanguage === 'en' && typeof RULES_HTML_EN !== 'undefined') ? RULES_HTML_EN : RULES_HTML; }
    else if (currentTab === 'progress' && typeof initProgressTab === 'function') initProgressTab();
    else if (currentTab === 'review' && typeof initReviewTab === 'function') initReviewTab();
    else if (currentTab === 'resources') renderResources();
  } catch (e) { console.error('toggleContentLanguage:', e); }
}

/* ==================== الأحداث والتهيئة ==================== */
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
document.querySelectorAll(".filter-btn[data-filter]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".filter-btn[data-filter]").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  currentFilter = b.dataset.filter;
  renderVerbs();
}));
document.getElementById("search").addEventListener("input", e => {
  currentSearch = e.target.value;
  renderCurrent();
});

/* ============================================================
   ✅ إضافات جديدة: Sidebar + Language Dropdown
   ============================================================ */

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebarOverlay');
  if (!sb) return;
  
  const isOpen = sb.classList.contains('open');
  
  if (isOpen) {
    sb.classList.remove('open');
    if (ov) ov.classList.remove('active');
  } else {
    sb.classList.add('open');
    if (ov) ov.classList.add('active');
  }
}

function toggleLangDropdown(ev) {
  if (ev) ev.stopPropagation();
  const menu = document.getElementById('langDropdownMenu');
  if (menu) menu.classList.toggle('open');
}

function setLanguage(lang, ev) {
  if (ev) ev.stopPropagation();
  if (typeof contentLanguage !== 'undefined' && contentLanguage !== lang) {
    if (typeof toggleContentLanguage === 'function') toggleContentLanguage();
  }
  try {
    if (typeof switchLanguage === 'function' && typeof currentLang !== 'undefined' && currentLang !== lang) {
      switchLanguage();
    }
  } catch(e) { }
  updateLangDropdownUI(lang);
  const menu = document.getElementById('langDropdownMenu');
  if (menu) menu.classList.remove('open');
}

function updateLangDropdownUI(lang) {
  const label = document.getElementById('langDropdownLabel');
  if (label) label.textContent = lang === 'de' ? '🌐 Deutsch' : '🌐 English';
  const chkDe = document.getElementById('langCheck-de');
  const chkEn = document.getElementById('langCheck-en');
  if (chkDe) chkDe.textContent = lang === 'de' ? '✓' : '';
  if (chkEn) chkEn.textContent = lang === 'en' ? '✓' : '';
  document.querySelectorAll('.lang-option').forEach(o => {
    o.classList.toggle('active', o.dataset.lang === lang);
  });
}

document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.lang-dropdown-wrap');
  if (wrap && !wrap.contains(e.target)) {
    const menu = document.getElementById('langDropdownMenu');
    if (menu) menu.classList.remove('open');
  }
});

(function initSidebarLang() {
  const lang = (typeof contentLanguage !== 'undefined') ? contentLanguage : 'de';
  updateLangDropdownUI(lang);
  if (typeof currentTab !== 'undefined') {
    document.querySelectorAll('.sidebar-item').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === currentTab);
    });
  }
})();

(function init() {
  const label = document.getElementById('currentLangLabel');
  if (label) label.textContent = contentLanguage === 'de' ? '(Deutsch)' : '(English)';
  const tBtn = document.getElementById('translationToggleBtn');
  if (tBtn) tBtn.textContent = translationVisible ? 'إخفاء الترجمة 👁️‍🗨️' : 'إظهار الترجمة 👁️';
  applyDarkMode();
  renderVerbs();
  try { if (typeof applyLanguage === 'function') applyLanguage(); } catch(e) {}
   applyTranslationVisibility();
})();
</script>

<div id="grammarModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.85); z-index:9999; backdrop-filter:blur(5px); overflow-y:auto;">
  <div style="background:#fff; margin: 30px auto; width:96%; max-width:1400px; border-radius:16px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); position:relative; min-height: 80vh;">
    <button onclick="closeGrammarModal()" style="position:absolute; top:15px; left:15px; background:#ef4444; color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:16px; z-index:10; box-shadow:0 4px 6px rgba(0,0,0,0.1);">✖ إغلاق</button>
    <div id="grammarModalContent" style="padding:40px; direction:rtl; overflow-x:auto;"></div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  window.closeGrammarModal = function() {
    document.getElementById('grammarModal').style.display = 'none';
    document.body.style.overflow = 'auto'; 
  };

  window.openGrammarModal = function(htmlContent) {
    const modalContent = document.getElementById('grammarModalContent');
    modalContent.innerHTML = htmlContent;
    
    modalContent.style.direction = 'rtl';
    modalContent.style.textAlign = 'right';
    
    document.getElementById('grammarModal').style.display = 'block';
    document.body.style.overflow = 'hidden'; 
  };

  setTimeout(() => {
    document.body.addEventListener('click', function(e) {
      const header = e.target.closest('.grammar-card-header, .rule-section h3');
      
      if (header) {
        e.preventDefault();
        e.stopPropagation();
        
        let contentDiv = null;
        
        if (header.classList.contains('grammar-card-header')) {
          contentDiv = header.parentElement.querySelector('.grammar-content');
        } 
        else if (header.tagName === 'H3') {
          contentDiv = header.parentElement.querySelector('.rule-content');
        }

        if (contentDiv) {
          const clone = contentDiv.cloneNode(true);
          clone.style.display = 'block'; 
          window.openGrammarModal(clone.innerHTML);
        }
      }
    }, true); 
  }, 1500);
});
</script>

<!-- ✅ السكربت المُعدل لفرز الكلمات وربطها بالمواضيع بذكاء -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(() => {
      try {
        if (typeof LESSONS !== 'undefined' && Array.isArray(LESSONS)) {
          
          // تأمين المصفوفات في حال لم تكن معرّفة
          if (typeof VERBS === 'undefined') window.VERBS = [];
          if (typeof NOUNS === 'undefined') window.NOUNS = [];
          if (typeof ADJECTIVES === 'undefined') window.ADJECTIVES = [];

          LESSONS.forEach(lesson => {
            if (lesson.newWords && Array.isArray(lesson.newWords)) {
              lesson.newWords.forEach(word => {
                if (!word || !word.de) return; // تخطي أي كلمة فارغة
                
                const topicName = word.topic || "مفردات الدروس";
                const cleanDe = word.de.toLowerCase().trim();

                // 1. فرز الأفعال
                if (word.type || (word.präsens && word.präsens.length > 0)) {
                  if (!VERBS.find(v => v.de.toLowerCase().trim() === cleanDe)) {
                    word.topic = topicName;
                    VERBS.push(word);
                  }
                } 
                // 2. فرز الأسماء (يبدأ بـ der, die, das)
                else if (cleanDe.startsWith("der ") || cleanDe.startsWith("die ") || cleanDe.startsWith("das ")) {
                  if (!NOUNS.find(n => n.de.toLowerCase().trim() === cleanDe)) {
                    word.topic = topicName;
                    NOUNS.push(word);
                  }
                } 
                // 3. فرز الصفات (الباقي)
                else {
                  if (!ADJECTIVES.find(a => a.de.toLowerCase().trim() === cleanDe)) {
                    word.topic = topicName;
                    ADJECTIVES.push(word);
                  }
                }
              });
            }
          });
          console.log("✅ تمت إضافة مفردات الدروس بنجاح!");
        }
      } catch (e) {
        console.error("حدث خطأ في ملف lessons.js:", e);
      }

      // تحديث الشاشة
      if (typeof currentTab !== 'undefined' && ['verbs', 'nouns', 'adjectives'].includes(currentTab)) {
         if (typeof buildTopicFilters === 'function') buildTopicFilters(currentTab);
         if (typeof renderCurrent === 'function') renderCurrent();
      }
    }, 1000); 
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // 1. فتح الدرس مباشرة إذا كان في الرابط
    if (window.location.hash.startsWith('#lesson-')) {
        const lessonId = window.location.hash.replace('#lesson-', '');
        setTimeout(() => {
            if (typeof openLesson === 'function') openLesson(lessonId);
        }, 1000); 
    } else if (window.location.hash) {
        // فتح التبويب مباشرة إذا كان في الرابط (مثلاً #nouns)
        const tabName = window.location.hash.replace('#', '');
        setTimeout(() => {
            if (typeof switchTab === 'function') switchTab(tabName);
        }, 500);
    }

    // 2. دعم زر الرجوع للخلف في المتصفح (لكل الموقع)
    window.addEventListener('popstate', function(event) {
      const singleLesson = document.getElementById('singleLessonContent');
      
      // إذا كنا في درس ونضغط رجوع، نغلق الدرس ونعود للقائمة
      if (singleLesson && !singleLesson.classList.contains('hidden')) {
        if (typeof closeSingleLesson === 'function') closeSingleLesson();
      } 
      // إذا كنا في تبويب ونضغط رجوع، نعود للتبويب السابق
      else if (event.state && event.state.tab) {
        if (typeof switchTab === 'function') switchTab(event.state.tab);
      } else {
        // العودة للتبويب الافتراضي (الأفعال) إذا لم تكن هناك حالة
        if (typeof switchTab === 'function') switchTab('verbs');
      }
    });
  });
      
</script>
